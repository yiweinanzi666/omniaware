[project]
name = "omniaware"
version = "0.1.0"
description = "Omni-Aware: uncertainty-gated retrieval and Evidence Attention Bias for multimodal QA"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "transformers>=4.57",
    "pillow>=10",
]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=14"]
webqa = ["spacy>=3.7", "word2number>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
omniaware-run = "omniaware.run:main"
omniaware-score = "omniaware.eval.score_official:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
